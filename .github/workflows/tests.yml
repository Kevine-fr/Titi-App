name: Tests

# Les épreuves sur chaque PR et chaque push sur dev : une PR ne s'annonce
# prête qu'avec cette coche verte (CLAUDE.md).
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Contrat de sauvegarde
        working-directory: .
        run: bash tests/sauvegarde.test.sh
